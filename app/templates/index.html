<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı Sulama Sistemi</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <div class="container glass-panel">
        <header class="app-header">
            <div class="logo">
                <i class="ph ph-drop"></i>
            </div>
            <h1>Akıllı Sulama</h1>
            <p>Hava durumuna dayalı modern sulama kararları</p>
        </header>

        <div class="main-content">
            <!-- Sol Panel: Parsel Listesi ve Ekleme -->
            <div class="sidebar">
                <div class="card">
                    <h2><i class="ph ph-map-pin"></i> Parsellerim</h2>
                    <ul id="parcel-list" class="parcel-list">
                        <!-- JS ile doldurulacak -->
                    </ul>
                </div>

                <div class="card mt-2">
                    <h2><i class="ph ph-plus-circle"></i> Yeni Parsel Ekle</h2>
                    <form id="add-parcel-form">
                        <div class="form-group">
                            <input type="text" id="p-name" placeholder="Parsel Adı (Örn: Arka Bahçe)" required>
                        </div>
                        <div class="form-group">
                            <input type="number" step="0.0001" id="p-lat" placeholder="Enlem (Örn: 39.77)" required>
                        </div>
                        <div class="form-group">
                            <input type="number" step="0.0001" id="p-lon" placeholder="Boylam (Örn: 30.52)" required>
                        </div>
                        <div class="form-group">
                            <select id="p-crop" required>
                                <option value="" disabled selected>Ürün Seçin</option>
                                <option value="sebze">Sebze</option>
                                <option value="tahil">Tahıl</option>
                                <option value="meyve_bahcesi">Meyve Bahçesi</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Parseli Ekle</button>
                    </form>
                </div>
            </div>

            <!-- Sağ Panel: Kontrol ve Sonuçlar -->
            <div class="dashboard">
                <div class="card dashboard-hero">
                    <h2 id="active-parcel-name">Lütfen Bir Parsel Seçin</h2>
                    
                    <div id="dashboard-content" class="hidden">
                        <div class="weather-widgets">
                            <div class="widget">
                                <i class="ph ph-thermometer-hot text-orange"></i>
                                <div class="widget-info">
                                    <span class="label">Sıcaklık</span>
                                    <span class="value" id="val-temp">- °C</span>
                                </div>
                            </div>
                            <div class="widget">
                                <i class="ph ph-cloud-rain text-blue"></i>
                                <div class="widget-info">
                                    <span class="label">Yağış</span>
                                    <span class="value" id="val-rain">- mm</span>
                                </div>
                            </div>
                            <div class="widget">
                                <i class="ph ph-drop text-teal"></i>
                                <div class="widget-info">
                                    <span class="label">Nem</span>
                                    <span class="value" id="val-humidity">- %</span>
                                </div>
                            </div>
                        </div>

                        <div class="decision-box mt-2" id="decision-box">
                            <h3 style="border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; margin-bottom: 1rem;"><i class="ph ph-brain"></i> Yapay Zeka Kararı</h3>
                            
                            <div style="margin: 1.5rem 0; padding: 1.5rem; border-radius: 8px; font-weight: bold; font-size: 1.5rem; text-align: center;" id="ai-result-box">
                                <i id="decision-icon"></i> <span id="decision-text">Sistem Bekleniyor...</span>
                            </div>
                            
                            <div style="text-align: center; font-size: 1.1rem; color: #4b5563;" id="ai-explanation">
                                <!-- Explanation text -->
                            </div>
                        </div>

                        <button id="btn-check" class="btn btn-primary w-100 mt-2 btn-large">
                            <i class="ph ph-arrows-clockwise"></i> Bugünün Kararını Üret
                        </button>
                    </div>
                </div>

                <div class="card mt-2">
                    <h2><i class="ph ph-clock-counter-clockwise"></i> Sulama Geçmişi</h2>
                    <div class="history-list-wrapper">
                        <ul id="history-list" class="history-list">
                            <!-- JS ile doldurulacak -->
                            <li class="empty-state">Parsel seçilmedi veya geçmiş yok.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
